name: CI - Heart Disease Training

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah estimator Random Forest'
        required: false
        default: '100'
      max_depth:
        description: 'Kedalaman maksimum pohon'
        required: false
        default: '10'
      test_size:
        description: 'Proporsi data test (0.0 - 1.0)'
        required: false
        default: '0.2'

jobs:
  train:
    name: Train via MLflow Project
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      # 3. Install MLflow dan dependencies
      - name: 📦 Install Dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 dagshub

      # 4. Setup Conda (wajib untuk mlflow run --env-manager conda)
      - name: 🐍 Setup Miniconda
        shell: bash -el {0}
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/ayupramudita63/my-first-repo.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}"    >> $GITHUB_ENV

      # 5. Set DagsHub credentials sebagai environment variable
      - name: 🔐 Set DagsHub Credentials
        shell: bash -el {0}
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/ayupramudita63/my-first-repo.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}"    >> $GITHUB_ENV

      # 6. Jalankan MLflow Project dengan mlflow run
      - name: 🚀 Run MLflow Project
        shell: bash -el {0}
        id: get_run_id
        run: |
          RUN_ID=$(find mlruns -name "meta.yaml" \
            | xargs grep -l "status: FINISHED" 2>/dev/null \
            | head -1 \
            | xargs grep "run_id:" \
            | awk '{print $2}')
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Run ID: $RUN_ID"

      # 7. Simpan artefak ke GitHub
      - name: 📤 Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-run-${{ github.run_number }}
          path: mlruns/
          retention-days: 30

      # 8. Build Docker Image
      - name: 🐳 Build Docker Image
        shell: bash -el {0}
        run: |
          if [ -n "${{ env.RUN_ID }}" ]; then
            echo "🐳 Building Docker untuk run: ${{ env.RUN_ID }}"
            mlflow models build-docker \
              --model-uri "runs:/${{ env.RUN_ID }}/model" \
              --name "ayupramudita63/heart-disease-classifier:latest"
          else
            echo "⚠️ Run ID tidak ditemukan, skip build Docker"
          fi

      # 9. Push Docker Image ke Docker Hub
      - name: 🐳 Push ke Docker Hub
        shell: bash -el {0}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ayupramudita63/heart-disease-classifier:latest
        continue-on-error: true

      # 10. Summary
      - name: 📊 Job Summary
        run: |
          echo "## ✅ CI Training Selesai" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number   | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow Run ID| ${{ env.RUN_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| n_estimators | ${{ github.event.inputs.n_estimators || '100' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| max_depth    | ${{ github.event.inputs.max_depth || '10' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow UI    | https://dagshub.com/ayupramudita63/my-first-repo.mlflow |" >> $GITHUB_STEP_SUMMARY
